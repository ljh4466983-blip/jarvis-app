name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - run: chmod +x gradlew && ./gradlew assembleDebug --stacktrace
      - run: cp app/build/outputs/apk/debug/app-debug.apk jarvis.apk
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: jarvis.apk
      # 휴대폰에서 바로 받을 수 있게 "최신 버전" 릴리스로 게시
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest jarvis.apk --title "자비스 최신 버전" --notes "커밋 ${GITHUB_SHA::7} 빌드" --latest
      # APK를 apk 브랜치에도 보관
      - name: Store on apk branch
        run: |
          mkdir out && cp jarvis.apk out/ && cd out
          git init -q -b apk && git add jarvis.apk
          git -c user.name=github-actions -c user.email=actions@github.com commit -qm "APK ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apk
